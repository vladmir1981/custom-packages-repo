name: Build Custom OpenWrt Packages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.ipk'
      - '**/Packages*'
      - 'README.md'
      - 'manifest.json'
      - 'arch_map.json'

# ВАЖНО: без этого автопуш обратно в репо не сработает
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages via SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          # Пробуем собрать СТАНДАРТНЫЙ пакет — без кастомных фидов.
          PACKAGES: curl
          INDEX: 1
          IGNORE_ERRORS: 1

      - name: Collect built packages
        if: always()
        run: |
          echo "=== Проверяем, что собралось ==="
          find bin/packages -name "*.ipk" -print || true
          find bin/packages -name "Packages*" -print || true

      - name: Publish packages to repository
        if: success()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          mkdir -p "$ARCH"
          SRC_IPK_DIR="bin/packages/$ARCH/packages"
          if [ -d "$SRC_IPK_DIR" ]; then
            cp -v "$SRC_IPK_DIR"/*.ipk "$ARCH"/ 2>/dev/null || true
            cp -v "$SRC_IPK_DIR"/Packages "$ARCH"/ 2>/dev/null || true
            cp -v "$SRC_IPK_DIR"/Packages.gz "$ARCH"/ 2>/dev/null || true
            cp -v "$SRC_IPK_DIR"/Packages.manifest "$ARCH"/ 2>/dev/null || true
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ARCH"/*
          git commit -m "auto: rebuild $ARCH packages" || echo "Нет изменений для коммита"
          git push origin main || echo "Нечего пушить"
