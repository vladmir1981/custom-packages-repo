name: Build Custom OpenWrt Packages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.ipk'
      - '**/Packages*'
      - 'README.md'
      - 'manifest.json'
      - 'arch_map.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages via SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          # Ссылаемся на СВОЙ форк — у него default branch = zap1
          EXTRA_FEEDS: >-
            src-git zapret https://github.com/vladmir1981/zapret-openwrt.git
          PACKAGES: zapret luci-app-zapret
          INDEX: 1
          IGNORE_ERRORS: 1

      - name: Collect built packages
        if: always()
        run: |
          find bin -name "*.ipk" -print || true
          find bin -name "Packages*" -print || true

      - name: Publish packages to repository
        if: success()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          mkdir -p "$ARCH"
          IPK_FILES=$(find bin -name "*.ipk" -type f | head -50 || true)
          INDEX_FILES=$(find bin -name "Packages*" -type f || true)
          if [ -z "$IPK_FILES" ]; then
            echo "⚠ Ни одного .ipk не найдено."
            exit 0
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp -v "$f" "$ARCH"/
          done <<< "$IPK_FILES"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp -v "$f" "$ARCH"/
          done <<< "$INDEX_FILES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ARCH"/*
          git commit -m "auto: rebuild $ARCH packages" || echo "Нет изменений"
          git push origin main || echo "Нечего пушить"