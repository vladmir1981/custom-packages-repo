name: Build Custom OpenWrt Packages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.ipk'
      - '**/*.apk'
      - '**/Packages*'
      - 'README.md'
      - 'manifest.json'
      - 'arch_map.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "24.10.5"
            arch: aarch64_cortex-a53
            out_dir: 24.10/aarch64_cortex-a53

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show current feeds.conf (for debug)
        run: |
          echo "=== ДО добавления фида ==="
          cat feeds.conf 2>/dev/null || echo "(feeds.conf ещё нет)"

      - name: Build packages via SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ matrix.version }}
          # ВАЖНО: одной строкой в кавычках, без YAML-многострочного блока
          EXTRA_FEEDS: "src-git zapret https://github.com/vladmir1981/zapret-openwrt.git"
          PACKAGES: "zapret luci-app-zapret"
          INDEX: 1
          IGNORE_ERRORS: 1

      - name: Collect built packages
        if: always()
        run: |
          echo "=== Поиск .ipk ==="
          find bin -name "*.ipk" -print || true
          echo "=== Поиск .apk ==="
          find bin -name "*.apk" -print || true