name: Build Custom OpenWrt Packages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.ipk'
      - '**/Packages*'
      - 'README.md'
      - 'manifest.json'
      - 'arch_map.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # mediatek/filogic — ASUS RT-AX53U, ZBT Z8102AX, Xiaomi AX3000T и др.
          - arch: aarch64_cortex-a53
            target: mediatek
            subtarget: filogic
            out: aarch64_cortex-a53

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages via SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
          # Ветка указывается через ^ (карет), это формат OpenWrt feeds
          EXTRA_FEEDS: >-
            src-git zapret https://github.com/remittor/zapret-openwrt.git^zap1
          PACKAGES: zapret luci-app-zapret
          INDEX: 1
          IGNORE_ERRORS: 1

      - name: Collect built packages
        if: always()
        run: |
          echo "=== Что лежит в bin/packages ==="
          find bin/packages -maxdepth 4 -type d || true
          echo "=== Что нашли .ipk ==="
          find bin -name "*.ipk" -print || true
          echo "=== Индексы ==="
          find bin -name "Packages*" -print || true

      - name: Publish packages to repository
        if: success()
        env:
          OUT: ${{ matrix.out }}
        run: |
          set -e
          mkdir -p "$OUT"

          IPK_FILES=$(find bin -name "*.ipk" -type f | head -50 || true)
          INDEX_FILES=$(find bin -name "Packages*" -type f || true)

          if [ -z "$IPK_FILES" ]; then
            echo "⚠ Ни одного .ipk не найдено — нечего публиковать."
            exit 0
          fi

          echo "Найдены .ipk:"
          echo "$IPK_FILES"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp -v "$f" "$OUT"/
          done <<< "$IPK_FILES"

          echo "Найдены индексы:"
          echo "$INDEX_FILES"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp -v "$f" "$OUT"/
          done <<< "$INDEX_FILES"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"/*
          git commit -m "auto: rebuild $OUT packages" || echo "Нет изменений для коммита"
          git push origin main || echo "Нечего пушить"