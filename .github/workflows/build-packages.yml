name: Build Custom OpenWrt Packages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.ipk'
      - '**/Packages*'
      - 'README.md'
      - 'manifest.json'
      - 'arch_map.json'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64_cortex-a53

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages via SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          # Какие пакеты собирать (имена пакетов, как в Makefile)
          PACKAGES: zapret2
          # Внешние фиды с исходниками — один фид на строку
          EXTRA_FEEDS: >-
            src-git zapret2 https://github.com/spvkgn/zapret2-openwrt.git
          # Генерируем Packages и Packages.gz
          INDEX: 1
          # Продолжаем, даже если какой-то пакет не собрался
          IGNORE_ERRORS: 1

      - name: Collect built packages
        if: always()
        run: |
          echo "=== Проверяем, что собралось ==="
          find bin/packages -name "*.ipk" -print || true
          find bin/packages -name "Packages*" -print || true

      - name: Publish packages to repository
        if: success()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          # Создаём папку архитектуры (если ещё нет — она уже есть в репо)
          mkdir -p "$ARCH"

          # Копируем .ipk и индекс из SDK-билда в папку архитектуры
          SRC_IPK_DIR="bin/packages/$ARCH/packages"
          if [ -d "$SRC_IPK_DIR" ]; then
            cp -v "$SRC_IPK_DIR"/*.ipk "$ARCH"/ 2>/dev/null || true
            cp -v "$SRC_IPK_DIR"/Packages "$ARCH"/ 2>/dev/null || true
            cp -v "$SRC_IPK_DIR"/Packages.gz "$ARCH"/ 2>/dev/null || true
            cp -v "$SRC_IPK_DIR"/Packages.manifest "$ARCH"/ 2>/dev/null || true
          fi

          # Настраиваем коммит
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ARCH"/*
          git commit -m "auto: rebuild $ARCH packages" || echo "Нет изменений для коммита"
          git push origin main || echo "Нечего пушить"