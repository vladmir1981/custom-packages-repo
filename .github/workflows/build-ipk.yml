name: Build IPK Packages (23.05 / 24.10)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.ipk'
      - '**/*.apk'
      - '**/Packages*'
      - 'README.md'
      - 'manifest.json'
      - 'arch_map.json'

concurrency:
  group: ipk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: "24.10.5"
            target: mediatek
            subtarget: filogic
            out_dir: 24.10/aarch64_cortex-a53
          - version: "24.10.5"
            target: ramips
            subtarget: mt7621
            out_dir: 24.10/mipsel_24kc
          - version: "23.05.5"
            target: mediatek
            subtarget: filogic
            out_dir: 23.05/aarch64_cortex-a53
          - version: "23.05.5"
            target: ramips
            subtarget: mt7621
            out_dir: 23.05/mipsel_24kc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gawk unzip zlib1g-dev libncurses5-dev \
                              libssl-dev file wget rsync python3 xz-utils zstd

      - name: Download and extract OpenWrt SDK
        env:
          VER: ${{ matrix.version }}
          TGT: ${{ matrix.target }}
          SUB: ${{ matrix.subtarget }}
        run: |
          set -e
          BASE="https://downloads.openwrt.org/releases/${VER}/targets/${TGT}/${SUB}"
          wget -q "$BASE/sha256sums"
          IB=$(grep -oE 'openwrt-sdk-[^ ]*Linux-x86_64\.tar\.(zst|xz)' sha256sums | head -1)
          if [ -z "$IB" ]; then
            echo "SDK не найден"; head -20 sha256sums; exit 1
          fi
          echo "SDK: $IB"
          wget -q "$BASE/$IB"
          mkdir -p sdk
          if [[ "$IB" == *.zst ]]; then
            tar --use-compress-program=unzstd -xf "$IB" -C sdk --strip-components=1
          else
            tar -xf "$IB" -C sdk --strip-components=1
          fi
          rm -f "$IB" sha256sums

      - name: Build zapret inside SDK
        working-directory: sdk
        run: |
          set -e
          cat > feeds.conf <<'EOF'
          src-git base https://git.openwrt.org/openwrt/openwrt.git
          src-git packages https://git.openwrt.org/feed/packages.git
          src-git luci https://git.openwrt.org/project/luci.git
          src-git routing https://git.openwrt.org/feed/routing.git
          src-git telephony https://git.openwrt.org/feed/telephony.git
          src-git zapret https://github.com/vladmir1981/zapret-openwrt.git
          EOF
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a -p zapret || true
          ./scripts/feeds install zapret || true
          ./scripts/feeds install luci-app-zapret || true
          make defconfig
          make package/zapret/compile V=s || \
          make package/feeds/zapret/zapret/compile V=s || \
          echo "FAILED zapret"
          make package/luci-app-zapret/compile V=s || \
          make package/feeds/zapret/luci-app-zapret/compile V=s || \
          echo "FAILED luci-app-zapret"

      - name: Collect and index zapret packages
        if: always()
        env:
          OUT_DIR: ${{ matrix.out_dir }}
        run: |
          set -e
          mkdir -p "$OUT_DIR"

          find sdk/bin -name "zapret_*.ipk" -type f -exec cp -v {} "$OUT_DIR"/ \;
          find sdk/bin -name "luci-app-zapret_*.ipk" -type f -exec cp -v {} "$OUT_DIR"/ \;

          FILE_COUNT=$(find "$OUT_DIR" -maxdepth 1 -name "*.ipk" -type f | wc -l)
          echo "Скопировано .ipk: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "⚠ Нет .ipk — выходим"
            exit 0
          fi

          python3 << 'PYEOF'
          import os, sys, hashlib, tarfile, gzip, io, glob

          OUT_DIR = os.environ["OUT_DIR"]

          def read_ar(data):
              """Читает ar-архив и возвращает {name: payload}."""
              if not data.startswith(b"!<arch>\n"):
                  return {}
              result = {}
              pos = 8
              while pos + 60 <= len(data):
                  hdr = data[pos:pos+60]
                  if hdr[58:60] != b"\x60\x0a":
                      break
                  name = hdr[0:16].decode("ascii", "ignore").strip()
                  try:
                      size = int(hdr[48:58].decode("ascii", "ignore").strip())
                  except ValueError:
                      break
                  pos += 60

                  # GNU extended name "#1/N"
                  if name.startswith("#1/"):
                      try:
                          name_len = int(name[3:])
                      except ValueError:
                          name_len = 0
                      real_name = data[pos:pos+name_len].decode("ascii", "ignore").strip()
                      pos += name_len
                      size -= name_len
                  else:
                      real_name = name.rstrip("/")

                  payload = data[pos:pos+size]
                  pos += size
                  if pos % 2 == 1:
                      pos += 1
                  result[real_name] = payload
              return result

          def get_control(ipk_path):
              with open(ipk_path, "rb") as f:
                  data = f.read()
              entries = read_ar(data)
              for name, payload in entries.items():
                  if name.startswith("control.tar"):
                      if payload[:2] == b"\x1f\x8b":
                          mode = "r:gz"
                      elif payload[:6] == b"\xfd7zXZ\x00":
                          mode = "r:xz"
                      elif payload[:3] == b"BZh":
                          mode = "r:bz2"
                      else:
                          mode = "r:"
                      try:
                          with tarfile.open(fileobj=io.BytesIO(payload), mode=mode) as tar:
                              for m in tar.getmembers():
                                  if m.name.endswith("/control") or m.name == "control" or m.name == "./control":
                                      f = tar.extractfile(m)
                                      if f:
                                          return f.read().decode("utf-8", "ignore")
                      except Exception as e:
                          print(f"  [!] control.tar не открылся: {e}")
                          continue
              return ""

          def make_entry(ipk_path):
              ctrl = get_control(ipk_path)
              if not ctrl:
                  print(f"  [!] Пропуск (control не прочитан): {os.path.basename(ipk_path)}")
                  return None
              fields = {}
              current = None
              for line in ctrl.splitlines():
                  if line.startswith(" ") and current:
                      fields[current] += "\n" + line
                  elif ": " in line:
                      k, v = line.split(": ", 1)
                      fields[k] = v
                      current = k
              size = os.path.getsize(ipk_path)
              with open(ipk_path, "rb") as f:
                  sha = hashlib.sha256(f.read()).hexdigest()
              name = os.path.basename(ipk_path)
              lines = [
                  f"Package: {fields.get('Package','')}",
                  f"Version: {fields.get('Version','')}",
                  f"Depends: {fields.get('Depends','')}",
                  f"Provides: {fields.get('Provides','')}",
                  "Status: install ok installed",
                  f"Architecture: {fields.get('Architecture','')}",
                  "Installed-Size: 0",
                  f"Filename: {name}",
                  f"Size: {size}",
                  f"SHA256sum: {sha}",
                  f"Description: {fields.get('Description','')}",
              ]
              return "\n".join(lines)

          ipks = sorted(glob.glob(os.path.join(OUT_DIR, "*.ipk")))
          entries = []
          for ipk in ipks:
              e = make_entry(ipk)
              if e:
                  entries.append(e)
                  print(f"  [+] {os.path.basename(ipk)}")

          if not entries:
              print("[!] Ни одной записи — Packages не будет создан")
              sys.exit(1)

          text = "\n\n".join(entries) + "\n"
          with open(os.path.join(OUT_DIR, "Packages"), "w", encoding="utf-8") as f:
              f.write(text)
          with gzip.open(os.path.join(OUT_DIR, "Packages.gz"), "wb") as f:
              f.write(text.encode("utf-8"))

          print(f"\n[+] Записано {len(entries)} пакетов в Packages и Packages.gz")
          PYEOF

          echo "=== Размер Packages ==="
          wc -c "$OUT_DIR/Packages" || true
          echo "=== Первые 30 строк ==="
          head -30 "$OUT_DIR/Packages" || true

      - name: Publish packages
        if: always()
        env:
          OUT_DIR: ${{ matrix.out_dir }}
        run: |
          set -e

          if [ ! -s "$OUT_DIR/Packages" ]; then
            echo "⚠ Packages пуст — не коммитим"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT_DIR"/*
          git commit -m "auto: rebuild $OUT_DIR packages + index" || echo "Нет изменений"

          git pull --rebase origin main || true
          for i in 1 2 3; do
            if git push origin main; then break; fi
            git pull --rebase origin main || true
            sleep 3
          done
