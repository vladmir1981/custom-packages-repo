name: Build IPK Packages (23.05 / 24.10)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.ipk'
      - '**/*.apk'
      - '**/Packages*'
      - 'README.md'
      - 'manifest.json'
      - 'arch_map.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- 24.10 ---
          - version: "24.10.5"
            target: mediatek
            subtarget: filogic
            out_dir: 24.10/aarch64_cortex-a53
          - version: "24.10.5"
            target: ramips
            subtarget: mt7621
            out_dir: 24.10/mipsel_24kc
          # --- 23.05 ---
          - version: "23.05.5"
            target: mediatek
            subtarget: filogic
            out_dir: 23.05/aarch64_cortex-a53
          - version: "23.05.5"
            target: ramips
            subtarget: mt7621
            out_dir: 23.05/mipsel_24kc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gawk unzip zlib1g-dev libncurses5-dev \
                              libssl-dev file wget rsync python3 xz-utils zstd

      - name: Download and extract OpenWrt SDK
        env:
          VER: ${{ matrix.version }}
          TGT: ${{ matrix.target }}
          SUB: ${{ matrix.subtarget }}
        run: |
          set -e
          BASE="https://downloads.openwrt.org/releases/${VER}/targets/${TGT}/${SUB}"
          echo "[Инфо] Качаем sha256sums из $BASE"
          wget -q "$BASE/sha256sums"
          IB=$(grep -oE 'openwrt-sdk-[^ ]*Linux-x86_64\.tar\.zst' sha256sums | head -1)
          if [ -z "$IB" ]; then
            echo "❌ Не нашли SDK в sha256sums" >&2
            cat sha256sums >&2
            exit 1
          fi
          echo "[Инфо] SDK файл: $IB"
          wget -q "$BASE/$IB"
          mkdir -p sdk
          tar -xf "$IB" -C sdk --strip-components=1
          rm -f "$IB" sha256sums
          echo "[Инфо] SDK распакован в ./sdk"

      - name: Build packages inside SDK
        working-directory: sdk
        env:
          PKGS: "zapret luci-app-zapret"
        run: |
          set -e
          cat > feeds.conf <<'EOF'
          src-git base https://git.openwrt.org/openwrt/openwrt.git
          src-git packages https://git.openwrt.org/feed/packages.git
          src-git luci https://git.openwrt.org/project/luci.git
          src-git routing https://git.openwrt.org/feed/routing.git
          src-git telephony https://git.openwrt.org/feed/telephony.git
          src-git zapret https://github.com/vladmir1981/zapret-openwrt.git
          EOF
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a -p zapret || true
          for pkg in $PKGS; do
            ./scripts/feeds install "$pkg" || echo "⚠ cannot install $pkg"
          done
          make defconfig
          for pkg in $PKGS; do
            echo "=== Компиляция $pkg ==="
            make package/$pkg/compile V=s || echo "❌ FAILED: $pkg"
          done

      - name: Collect built packages
        if: always()
        run: |
          echo "=== Найдено .ipk в sdk/bin ==="
          find sdk/bin -name "*.ipk" -print 2>/dev/null || true

      - name: Publish IPK packages
        if: always()
        env:
          OUT_DIR: ${{ matrix.out_dir }}
        run: |
          set -e
          mkdir -p "$OUT_DIR"
          IPK_FILES=$(find sdk/bin -name "*.ipk" -type f 2>/dev/null || true)
          if [ -z "$IPK_FILES" ]; then
            echo "⚠ Ни одного .ipk не найдено."
            exit 0
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp -v "$f" "$OUT_DIR"/
          done <<< "$IPK_FILES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR"/*
          git commit -m "auto: rebuild $OUT_DIR packages" || echo "Нет изменений"
          git push origin main || echo "Нечего пушить"