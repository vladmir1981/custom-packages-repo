name: Build IPK Packages (23.05 / 24.10)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.ipk'
      - '**/*.apk'
      - '**/Packages*'
      - 'README.md'
      - 'manifest.json'
      - 'arch_map.json'

concurrency:
  group: ipk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - version: "24.10.5"
            target: mediatek
            subtarget: filogic
            out_dir: 24.10/aarch64_cortex-a53
          - version: "24.10.5"
            target: ramips
            subtarget: mt7621
            out_dir: 24.10/mipsel_24kc
          - version: "23.05.5"
            target: mediatek
            subtarget: filogic
            out_dir: 23.05/aarch64_cortex-a53
          - version: "23.05.5"
            target: ramips
            subtarget: mt7621
            out_dir: 23.05/mipsel_24kc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gawk unzip zlib1g-dev libncurses5-dev \
                              libssl-dev file wget rsync python3 xz-utils zstd

      - name: Download and extract OpenWrt SDK
        env:
          VER: ${{ matrix.version }}
          TGT: ${{ matrix.target }}
          SUB: ${{ matrix.subtarget }}
        run: |
          set -e
          BASE="https://downloads.openwrt.org/releases/${VER}/targets/${TGT}/${SUB}"
          wget -q "$BASE/sha256sums"
          IB=$(grep -oE 'openwrt-sdk-[^ ]*Linux-x86_64\.tar\.(zst|xz)' sha256sums | head -1)
          if [ -z "$IB" ]; then
            echo "SDK не найден"; head -20 sha256sums; exit 1
          fi
          echo "SDK файл: $IB"
          wget -q "$BASE/$IB"
          mkdir -p sdk
          if [[ "$IB" == *.zst ]]; then
            tar --use-compress-program=unzstd -xf "$IB" -C sdk --strip-components=1
          else
            tar -xf "$IB" -C sdk --strip-components=1
          fi
          rm -f "$IB" sha256sums

      - name: Build zapret inside SDK
        working-directory: sdk
        run: |
          set -e
          cat > feeds.conf <<'EOF'
          src-git base https://git.openwrt.org/openwrt/openwrt.git
          src-git packages https://git.openwrt.org/feed/packages.git
          src-git luci https://git.openwrt.org/project/luci.git
          src-git routing https://git.openwrt.org/feed/routing.git
          src-git telephony https://git.openwrt.org/feed/telephony.git
          src-git zapret https://github.com/vladmir1981/zapret-openwrt.git
          EOF
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a -p zapret || true
          ./scripts/feeds install zapret || true
          ./scripts/feeds install luci-app-zapret || true
          make defconfig
          make package/zapret/compile V=s || \
          make package/feeds/zapret/zapret/compile V=s || \
          echo "FAILED zapret"
          make package/luci-app-zapret/compile V=s || \
          make package/feeds/zapret/luci-app-zapret/compile V=s || \
          echo "FAILED luci-app-zapret"

      - name: Find index script in SDK
        id: find_idx
        run: |
          echo "=== Ищем ipkg-make-index.sh и opkg-make-index ==="
          find sdk -name "ipkg-make-index.sh" -o -name "opkg-make-index" 2>/dev/null || true
          ls -la sdk/scripts/ | head -50 || true
          ls -la sdk/staging_dir/host/bin/ | grep -i index || true

      - name: Collect and index zapret packages
        if: always()
        env:
          OUT_DIR: ${{ matrix.out_dir }}
        run: |
          set -e
          mkdir -p "$OUT_DIR"

          # Копируем .ipk
          find sdk/bin -name "zapret_*.ipk" -type f -exec cp -v {} "$OUT_DIR"/ \;
          find sdk/bin -name "luci-app-zapret_*.ipk" -type f -exec cp -v {} "$OUT_DIR"/ \;

          FILE_COUNT=$(find "$OUT_DIR" -maxdepth 1 -name "*.ipk" -type f | wc -l)
          echo "Скопировано .ipk: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "⚠ Нет .ipk — выходим"
            exit 0
          fi

          # Пробуем разные пути к скрипту генерации индекса
          IDX_SCRIPT=""
          for candidate in \
              "sdk/scripts/ipkg-make-index.sh" \
              "sdk/staging_dir/host/bin/ipkg-make-index.sh" \
              "sdk/staging_dir/host/bin/opkg-make-index"; do
            if [ -x "$candidate" ]; then
              IDX_SCRIPT="$candidate"
              break
            fi
          done

          if [ -z "$IDX_SCRIPT" ]; then
            echo "❌ Не нашли скрипт индекса. Устанавливаем opkg-tools..."
            sudo apt install -y opkg-utils || sudo apt install -y ipkg-utils || true
            IDX_SCRIPT=$(command -v opkg-make-index || command -v ipkg-make-index || true)
          fi

          echo "=== Используем индекс-скрипт: $IDX_SCRIPT ==="

          if [ -n "$IDX_SCRIPT" ]; then
            cd "$OUT_DIR"
            "$GITHUB_WORKSPACE/$IDX_SCRIPT" . > Packages 2>&1 || {
              echo "⚠ Скрипт упал, пробуем как абсолютный путь"
              "$IDX_SCRIPT" . > Packages 2>&1 || echo "Ошибка"
            }
            cd -
            gzip -kf "$OUT_DIR/Packages" || true
            echo "=== Первые строки Packages ==="
            head -40 "$OUT_DIR/Packages" || echo "(пусто)"
          else
            echo "⚠ Не нашли скрипт — попробуем вручную через python"
          fi

          ls -la "$OUT_DIR"

      - name: Publish packages
        if: always()
        env:
          OUT_DIR: ${{ matrix.out_dir }}
        run: |
          set -e
          if [ ! -f "$OUT_DIR/Packages" ] || [ ! -s "$OUT_DIR/Packages" ]; then
            echo "⚠ Packages пуст — пропускаем публикацию"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT_DIR"/*
          git commit -m "auto: rebuild $OUT_DIR packages (with index)" || echo "Нет изменений"

          git pull --rebase origin main || true
          for i in 1 2 3; do
            if git push origin main; then break; fi
            git pull --rebase origin main || true
            sleep 3
          done