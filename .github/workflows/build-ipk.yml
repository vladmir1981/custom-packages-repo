name: Build IPK Packages (23.05 / 24.10)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.ipk'
      - '**/*.apk'
      - '**/Packages*'
      - 'README.md'
      - 'manifest.json'
      - 'arch_map.json'

concurrency:
  group: ipk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1        # <-- job'ы идут по одному, без гонки за git
      matrix:
        include:
          - version: "24.10.5"
            target: mediatek
            subtarget: filogic
            out_dir: 24.10/aarch64_cortex-a53
          - version: "24.10.5"
            target: ramips
            subtarget: mt7621
            out_dir: 24.10/mipsel_24kc
          - version: "23.05.5"
            target: mediatek
            subtarget: filogic
            out_dir: 23.05/aarch64_cortex-a53
          - version: "23.05.5"
            target: ramips
            subtarget: mt7621
            out_dir: 23.05/mipsel_24kc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gawk unzip zlib1g-dev libncurses5-dev \
                              libssl-dev file wget rsync python3 xz-utils zstd

      - name: Download and extract OpenWrt SDK
        env:
          VER: ${{ matrix.version }}
          TGT: ${{ matrix.target }}
          SUB: ${{ matrix.subtarget }}
        run: |
          set -e
          BASE="https://downloads.openwrt.org/releases/${VER}/targets/${TGT}/${SUB}"
          echo "[Инфо] Качаем sha256sums из $BASE"
          wget -q "$BASE/sha256sums"
          echo "[Инфо] Ищем SDK в sha256sums..."
          IB=$(grep -oE 'openwrt-sdk-[^ ]*Linux-x86_64\.tar\.(zst|xz)' sha256sums | head -1)
          if [ -z "$IB" ]; then
            echo "SDK не найден. Первые 20 строк sha256sums:" >&2
            head -20 sha256sums >&2
            exit 1
          fi
          echo "[Инфо] SDK файл: $IB"
          wget -q "$BASE/$IB"
          mkdir -p sdk
          if [[ "$IB" == *.zst ]]; then
            tar --use-compress-program=unzstd -xf "$IB" -C sdk --strip-components=1
          else
            tar -xf "$IB" -C sdk --strip-components=1
          fi
          rm -f "$IB" sha256sums
          echo "[Инфо] SDK распакован в ./sdk"

      - name: Build zapret inside SDK
        working-directory: sdk
        run: |
          set -e
          cat > feeds.conf <<'EOF'
          src-git base https://git.openwrt.org/openwrt/openwrt.git
          src-git packages https://git.openwrt.org/feed/packages.git
          src-git luci https://git.openwrt.org/project/luci.git
          src-git routing https://git.openwrt.org/feed/routing.git
          src-git telephony https://git.openwrt.org/feed/telephony.git
          src-git zapret https://github.com/vladmir1981/zapret-openwrt.git
          EOF
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a -p zapret || true
          ./scripts/feeds install zapret || true
          ./scripts/feeds install luci-app-zapret || true
          make defconfig
          make package/zapret/compile V=s || \
          make package/feeds/zapret/zapret/compile V=s || \
          echo "FAILED zapret"
          make package/luci-app-zapret/compile V=s || \
          make package/feeds/zapret/luci-app-zapret/compile V=s || \
          echo "FAILED luci-app-zapret"

      - name: Collect only zapret packages
        if: always()
        run: |
          echo "=== Ищем zapret_* и luci-app-zapret_* ==="
          find sdk/bin -name "zapret_*.ipk" -print || true
          find sdk/bin -name "luci-app-zapret_*.ipk" -print || true

      - name: Publish IPK packages
        if: always()
        env:
          OUT_DIR: ${{ matrix.out_dir }}
        run: |
          set -e
          mkdir -p "$OUT_DIR"

          find sdk/bin -name "zapret_*.ipk" -type f -exec cp -v {} "$OUT_DIR"/ \;
          find sdk/bin -name "luci-app-zapret_*.ipk" -type f -exec cp -v {} "$OUT_DIR"/ \;

          FILE_COUNT=$(find "$OUT_DIR" -maxdepth 1 -name "*.ipk" -type f | wc -l)
          echo "Найдено в $OUT_DIR: $FILE_COUNT файлов .ipk"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "⚠ Ни одного .ipk не скопировано — выходим."
            exit 0
          fi

          if [ -f sdk/scripts/ipkg-make-index.sh ]; then
            sdk/scripts/ipkg-make-index.sh "$OUT_DIR" > "$OUT_DIR/Packages" 2>/dev/null || true
            gzip -kf "$OUT_DIR/Packages" || true
            echo "=== Индекс Packages сгенерирован ==="
            ls -la "$OUT_DIR"
          else
            echo "⚠ ipkg-make-index.sh не найден, индекс не создан"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT_DIR"/*
          git commit -m "auto: rebuild $OUT_DIR zapret packages" || echo "Нет изменений"

          git pull --rebase origin main || true
          for i in 1 2 3; do
            if git push origin main; then
              echo "Push успешен (попытка $i)"
              break
            fi
            echo "Push отклонён, подтягиваем изменения и пробуем снова..."
            git pull --rebase origin main || true
            sleep 3
          done