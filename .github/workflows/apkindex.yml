name: Generate APKINDEX for 25.12

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '25.12/**/*.apk'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch:
          - aarch64_cortex-a53
          - mipsel_24kc
          - mips_24kc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apk.static (v3)
        run: |
          set -e
          cd /tmp
          URL_BASE="https://dl-cdn.alpinelinux.org/alpine/edge/main/x86_64"
          echo "=== Ищем apk-tools-static ==="
          FILE=$(wget -qO- "$URL_BASE/" | grep -oE 'apk-tools-static-[^"]+\.apk' | head -1)
          if [ -z "$FILE" ]; then
            echo "Не нашли apk-tools-static — вывожу содержимое каталога:"
            wget -qO- "$URL_BASE/" | grep -i "apk-tools" | head -20
            exit 1
          fi
          echo "Downloading: $FILE"
          wget -q "$URL_BASE/$FILE"

          echo "=== Распаковка (это tar.gz-контейнер) ==="
          mkdir -p /tmp/apk_extract
          tar -xzf "$FILE" -C /tmp/apk_extract
          find /tmp/apk_extract -type f

          echo "=== Поиск apk.static ==="
          APK_BIN=$(find /tmp/apk_extract -name "apk.static" -type f | head -1)
          if [ -z "$APK_BIN" ]; then
            echo "apk.static не найден"
            exit 1
          fi
          chmod +x "$APK_BIN"
          echo "APK_BIN=$APK_BIN" >> $GITHUB_ENV
          echo "=== Версия apk ==="
          "$APK_BIN" --version || true

      - name: Generate APKINDEX for ${{ matrix.arch }}
        run: |
          set -e
          cd "25.12/${{ matrix.arch }}"
          echo "=== Файлы в папке ==="
          ls -la
          echo "=== Генерация APKINDEX.tar.gz ==="
          "$APK_BIN" index -o APKINDEX.tar.gz --allow-untrusted *.apk || {
            echo "=== Fallback: без --allow-untrusted ==="
            "$APK_BIN" index -o APKINDEX.tar.gz *.apk
          }
          echo "=== Результат ==="
          ls -la

      - name: Commit APKINDEX
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "25.12/${{ matrix.arch }}/APKINDEX.tar.gz"
          git commit -m "auto: rebuild APKINDEX for ${{ matrix.arch }}" || echo "нет изменений"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin main; then
              echo "Push успешен (попытка $i)"
              break
            fi
            echo "Push отклонён, повтор через 5 сек..."
            sleep 5
          done
