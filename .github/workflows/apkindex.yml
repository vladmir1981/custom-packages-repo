name: Generate APKINDEX for 25.12

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '25.12/**/*.apk'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch:
          - aarch64_cortex-a53
          - mipsel_24kc
          - mips_24kc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download OpenWrt 25.12 SDK (для apk-tools)
        run: |
          set -e
          VER="25.12.5"
          TGT="mediatek"
          SUB="filogic"
          BASE="https://downloads.openwrt.org/releases/${VER}/targets/${TGT}/${SUB}"
          wget -q "$BASE/sha256sums"
          SDK=$(grep -oE 'openwrt-sdk-[^ ]*Linux-x86_64\.tar\.zst' sha256sums | head -1)
          if [ -z "$SDK" ]; then
            echo "SDK не найден"; head -20 sha256sums; exit 1
          fi
          echo "Скачиваем: $SDK"
          wget -q "$BASE/$SDK"
          mkdir -p sdk
          tar --use-compress-program=unzstd -xf "$SDK" -C sdk --strip-components=1

          echo "=== Ищем apk в SDK ==="
          find sdk -name "apk" -type f 2>/dev/null | head -20

          APK_BIN=$(find sdk/staging_dir -name "apk" -type f 2>/dev/null | head -1)
          if [ -z "$APK_BIN" ]; then
            APK_BIN=$(find sdk -name "apk" -type f 2>/dev/null | head -1)
          fi
          if [ -z "$APK_BIN" ]; then
            echo "!!! apk не найден в SDK. Содержимое staging_dir:"
            ls -la sdk/staging_dir/ 2>/dev/null | head
            exit 1
          fi
          chmod +x "$APK_BIN"
          APK_BIN=$(realpath "$APK_BIN")
          echo "APK_BIN=$APK_BIN" >> $GITHUB_ENV
          echo "=== Найден apk: $APK_BIN ==="
          "$APK_BIN" --version || true

      - name: Generate APKINDEX for ${{ matrix.arch }}
        run: |
          set -e
          cd "25.12/${{ matrix.arch }}"
          rm -f APKINDEX.tar.gz
          ls -la
          echo "=== Генерация индекса ==="
          "$APK_BIN" index -o APKINDEX.tar.gz *.apk || {
            echo "=== Попытка с флагом --allow-untrusted ==="
            "$APK_BIN" index --allow-untrusted -o APKINDEX.tar.gz *.apk
          }
          ls -la

      - name: Commit APKINDEX
        if: success()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "25.12/${{ matrix.arch }}/APKINDEX.tar.gz"
          git commit -m "auto: APKINDEX for ${{ matrix.arch }}" || echo "нет изменений"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin main; then
              echo "Push успешен (попытка $i)"
              break
            fi
            sleep 5
          done
