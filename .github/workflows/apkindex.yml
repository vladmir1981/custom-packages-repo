name: Generate APKINDEX for 25.12

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '25.12/**/*.apk'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1        # <-- job'ы идут строго по одному
      matrix:
        arch:
          - aarch64_cortex-a53
          - mipsel_24kc
          - mips_24kc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate APKINDEX for ${{ matrix.arch }}
        run: |
          set -e
          docker run --rm \
            -v "$PWD/25.12/${{ matrix.arch }}:/repo" \
            -w /repo \
            ghcr.io/openwrt/sdk:x86_64 \
            sh -c '
              echo "=== apk version ==="
              apk --version
              echo "=== generating index ==="
              apk index -o APKINDEX.tar.gz --allow-untrusted *.apk
              echo "=== result ==="
              ls -la
            '

      - name: Commit APKINDEX
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "25.12/${{ matrix.arch }}/APKINDEX.tar.gz"
          git commit -m "auto: rebuild APKINDEX for ${{ matrix.arch }}" || echo "нет изменений"

          # Retry-цикл на случай гонки
          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin main; then
              echo "Push успешен (попытка $i)"
              break
            fi
            echo "Push отклонён, повтор через 5 сек..."
            sleep 5
          done
