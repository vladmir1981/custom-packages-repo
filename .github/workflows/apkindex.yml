name: Generate APKINDEX for 25.12

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '25.12/**/*.apk'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        arch:
          - aarch64_cortex-a53
          - mipsel_24kc
          - mips_24kc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate APKINDEX for ${{ matrix.arch }}
        run: |
          set -e
          docker run --rm \
            -v "$PWD/25.12/${{ matrix.arch }}:/repo" \
            -w /repo \
            ghcr.io/openwrt/sdk:x86_64 \
            sh -c '
              echo "=== searching for apk binary ==="
              APK_BIN=$(find / -type f -name "apk" 2>/dev/null | head -1)
              APK_STATIC=$(find / -type f -name "apk.static" 2>/dev/null | head -1)
              echo "apk       : $APK_BIN"
              echo "apk.static: $APK_STATIC"

              if [ -n "$APK_STATIC" ]; then
                APK="$APK_STATIC"
              elif [ -n "$APK_BIN" ]; then
                APK="$APK_BIN"
              else
                echo "=== APK NOT FOUND ANYWHERE — покажу что есть в /builder ==="
                ls -la /builder 2>/dev/null || true
                ls -la /builder/staging_dir/host/bin 2>/dev/null | head -30 || true
                exit 1
              fi

              echo "=== Using: $APK ==="
              "$APK" --version || true

              echo "=== generating index ==="
              "$APK" index -o APKINDEX.tar.gz --allow-untrusted *.apk

              echo "=== result ==="
              ls -la
            '

      - name: Commit APKINDEX
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "25.12/${{ matrix.arch }}/APKINDEX.tar.gz"
          git commit -m "auto: rebuild APKINDEX for ${{ matrix.arch }}" || echo "нет изменений"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin main; then
              echo "Push успешен (попытка $i)"
              break
            fi
            echo "Push отклонён, повтор через 5 сек..."
            sleep 5
          done
