name: Build APK Packages (snapshot / 25.12+)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.ipk'
      - '**/*.apk'
      - '**/Packages*'
      - 'README.md'
      - 'manifest.json'
      - 'arch_map.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            out_dir: snapshot/aarch64_cortex-a53
          - arch: mipsel_24kc
            out_dir: snapshot/mipsel_24kc
          - arch: mips_24kc
            out_dir: snapshot/mips_24kc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

            - name: Build APK via gh-action-sdk
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          EXTRA_FEEDS: |
            src-git zapret https://github.com/remittor/zapret-openwrt.git
          PACKAGES: "zapret luci-app-zapret"
          INDEX: 1
          IGNORE_ERRORS: 1

      - name: Collect built packages
        if: always()
        run: |
          echo "=== Поиск .apk ==="
          find bin -name "*.apk" -print || true
          echo "=== Поиск .ipk ==="
          find bin -name "*.ipk" -print || true

      - name: Publish APK packages
        if: success()
        env:
          OUT_DIR: ${{ matrix.out_dir }}
        run: |
          set -e
          mkdir -p "$OUT_DIR"
          APK_FILES=$(find bin -name "*.apk" -type f || true)
          INDEX_FILES=$(find bin -name "Packages*" -type f || true)
          APKINDEX_FILES=$(find bin -name "APKINDEX*" -type f || true)
          if [ -z "$APK_FILES" ] && [ -z "$INDEX_FILES" ] && [ -z "$APKINDEX_FILES" ]; then
            echo "⚠ Ни одного пакета/индекса не найдено."
            exit 0
          fi
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp -v "$f" "$OUT_DIR"/
          done <<< "$APK_FILES"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp -v "$f" "$OUT_DIR"/
          done <<< "$INDEX_FILES"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp -v "$f" "$OUT_DIR"/
          done <<< "$APKINDEX_FILES"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR"/*
          git commit -m "auto: rebuild $OUT_DIR packages" || echo "Нет изменений"
          git push origin main || echo "Нечего пушить"