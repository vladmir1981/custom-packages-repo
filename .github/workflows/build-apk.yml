name: Build APK Packages (snapshot)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.ipk'
      - '**/*.apk'
      - '**/Packages*'
      - 'README.md'
      - 'manifest.json'
      - 'arch_map.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53
            out_dir: snapshot/aarch64_cortex-a53
          - arch: mipsel_24kc
            out_dir: snapshot/mipsel_24kc
          - arch: mips_24kc
            out_dir: snapshot/mips_24kc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build APK via gh-action-sdk
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          EXTRA_FEEDS: |
            src-git zapret https://github.com/vladmir1981/zapret-openwrt.git
          PACKAGES: "zapret luci-app-zapret"
          INDEX: 1
          IGNORE_ERRORS: 1

      - name: Collect built packages
        if: always()
        run: |
          find bin -name "*.apk" -print || true
          find bin -name "*.ipk" -print || true

      - name: Publish APK packages
        if: success()
        env:
          OUT_DIR: ${{ matrix.out_dir }}
        run: |
          set -e
          mkdir -p "$OUT_DIR"
          FILES=$(find bin -name "*.apk" -type f 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo "no apk files"
            exit 0
          fi
          echo "$FILES" | while IFS= read -r f; do
            [ -z "$f" ] && continue
            cp -v "$f" "$OUT_DIR"/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR"/*
          git commit -m "auto: rebuild $OUT_DIR packages" || echo "no changes"
          git push origin main || echo "nothing to push"